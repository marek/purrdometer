name: packages

# Runs only when a v* tag is pushed or when started by hand from the Actions
# tab. Builds the Debian package and the Raspberry Pi image and keeps them as
# artifacts; a v* tag also drafts a release from them. No source zip: the
# package and the image are the release.
#
# Both jobs run the scripts a contributor runs locally,
# packaging/build-deb.sh and packaging/build-image.sh, on arm64 runners: the
# Pi's architecture, so nothing is emulated. The artifacts land in dist/, as
# they do locally.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: Debian package
    runs-on: ubuntu-24.04-arm
    # the Pi's release: GCC 14 for C++26, and the libraries the package links
    container: debian:trixie
    steps:
      - name: staging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
          git config --system --add safe.directory '*'

      # the whole history and its tags: tools/version.sh names the version
      # from them, a manual run's included
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # packaging/build-deps is the one list of them
      - name: build dependencies
        run: grep -v '^#' packaging/build-deps | xargs env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends

      - name: package
        run: packaging/build-deb.sh

      - name: keep the package
        uses: actions/upload-artifact@v4
        with:
          name: package-deb
          path: dist/*.deb
          if-no-files-found: error

  image:
    name: Raspberry Pi image
    needs: deb
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: image tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends e2fsprogs zerofree fdisk xz-utils curl dpkg

      - uses: actions/download-artifact@v4
        with:
          name: package-deb
          path: dist

      - name: image
        run: sudo packaging/build-image.sh dist/*.deb

      - name: keep the image
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: |
            dist/*.img.xz
            dist/*.img.xz.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            dist/* --draft --title "purrdometer ${{ github.ref_name }}"
