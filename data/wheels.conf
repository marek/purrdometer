# Known cat wheels, read by purrdometer-web and purrdometer-display.
# Installed as /usr/share/purrdometer/wheels.conf.
#
# inner is the running (inner) diameter: what the cat runs on and what
# distance is computed from. Makers often advertise the outer size instead.
# estimated = true marks an inner diameter that is not published; measure
# the wheel and give its diameter on the settings page for accuracy.
# Package data: replaced on upgrade, not for editing.
# Lengths take a unit: in, cm, mm or m.

[ferris-g5]
name = Ferris Cat Wheel G5
inner = 48in
outer = 51in
track = 12.5in
source = https://www.ferriscatwheel.com/pages/ferris-cat-exercise-wheel-gen5

[grand-ferris]
name = Grand Ferris Cat Wheel
inner = 60in
outer = 63in
track = 15in
source = https://www.ferriscatwheel.com/pages/grand-ferris-cat-exercise-wheel

[one-fast-cat]
name = One Fast Cat (Gen 7)
inner = 43in
outer = 48in
source = https://onefastcat.com/products/cat-wheel

# Star Cat publishes only the outer sizes.
[star-cat-l]
name = Star Cat Wheel L
inner = 38.5in
outer = 41.7in
track = 15.7in
estimated = true
source = https://starcatwheel.com

[star-cat-xl]
name = Star Cat Wheel XL
inner = 44.5in
outer = 47.2in
track = 15.7in
estimated = true
source = https://starcatwheel.com
