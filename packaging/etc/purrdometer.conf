# purrdometer configuration. After editing:
#   purrdometer-display --check-config && sudo systemctl restart purrdometer-display

[wheel]
# cm or in: how wheel sizes are shown, and what a plain number below means.
units = cm
# Your wheels are profiles, set on the settings page and kept in
# /var/lib/purrdometer/profiles.conf. These two only make the first one on a
# new install: a known wheel (`purrdometer-display --list-wheels`), and
# optionally the running surface (the inside of the track) you measured.
# A plain number is in the units above (123 = 123 cm); a unit always wins
# (48.5in, 1.23m).
model = ferris-g5
#diameter = 123

[display]
# Flip the screen and touch 180 degrees if the HAT is mounted upside down.
rotate180 = false
# Partial refreshes between full (flashing, anti-ghosting) refreshes.
full_refresh_every = 20
# Seconds between live updates while the wheel is turning.
active_refresh_s = 5

[web]
# The dashboard (purrdometer-web). It is read-only and has no login: keep it
# on the home network. 0.0.0.0 listens on every interface, 127.0.0.1 only locally.
bind = 0.0.0.0
port = 8080
# Who may save settings from the dashboard's gear page:
#   lan   any device on the home network (default)
#   pin   any device, with settings_pin
#   open  anyone who can reach the page
#   off   nobody: edit this file instead
# Saved settings go to /var/lib/purrdometer/settings.conf and win over this file.
settings_access = lan
#settings_pin = 2468
