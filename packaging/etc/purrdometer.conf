# purrdometer configuration. After editing:
#   purrdometer-display --check-config && sudo systemctl restart purrdometer-display
# Only rotations are stored, so changing the wheel recomputes every distance,
# history included.

[wheel]
# cm or in: how wheel sizes are shown, and what a plain number below means.
units = cm
# A known wheel; `purrdometer-display --wheels` lists them.
model = ferris-g5
# Or measure the running surface (the inside of the track) and set it here.
# A plain number is in the units above (123 = 123 cm); a unit always wins
# (48.5in, 1.23m). Overrides the model's diameter.
#diameter = 123

[display]
# Flip the screen and touch 180 degrees if the HAT is mounted upside down.
rotate180 = false
# Partial refreshes between full (flashing, anti-ghosting) refreshes.
full_refresh_every = 20
# Seconds between live updates while the wheel is turning.
active_refresh_s = 5

[web]
# The dashboard (purrdometer-web). It is read-only and has no login: keep it
# on the home network. 0.0.0.0 listens on every interface, 127.0.0.1 only locally.
bind = 0.0.0.0
port = 8080
