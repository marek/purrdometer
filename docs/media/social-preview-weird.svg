  <path d="M0 0 H675 L565 640 H0 Z" fill="#ffb000" opacity="0.92"/>
  <path d="M0 0 H640 L530 640 H0 Z" fill="#60e2d5" opacity="0.9"/>
  <path d="M0 0 H590 L480 640 H0 Z" fill="#111820"/>

  <g font-family="Helvetica">
