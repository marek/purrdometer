    <path d="M973 38 L1008 83 L1061 50 L1072 105 L1133 94 L1120 151 L1182 163 L1145 210 L1196 246 L1145 279 L1178 331 L1119 338 L1125 399 L1068 382 L1049 440 L1004 402 L966 448 L937 395 L884 424 L878 365 L817 370 L839 314 L782 290 L825 247 L778 206 L835 179 L811 123 L872 125 L876 65 L931 89 Z" fill="#ff4f87" stroke="#111820" stroke-width="8"/>
